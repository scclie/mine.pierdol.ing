name: deploy
on:
  push:
    branches: [main]

concurrency:
  group: mine-platform-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: startsWith(github.server_url, 'http://10.69.0.10') || startsWith(github.server_url, 'https://git.sccl.cc')
    runs-on: ubuntu-latest
    env:
      TASK12_ZIG_PREFIXES: /usr:/usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build and verification tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y ca-certificates curl xz-utils postgresql libpq-dev docker.io
          mkdir -p /tmp/opencode
          TOOLS="$(mktemp -d /tmp/opencode/mine-ci-tools-XXXXXX)"
          chmod 0755 "$TOOLS"
          cd "$TOOLS"
          curl --fail --show-error --location --proto '=https' --proto-redir '=https' -o zig-x86_64-linux-0.13.0.tar.xz https://mirror.pierdol.ing/zig/0.13.0/zig-x86_64-linux-0.13.0.tar.xz
          printf '%s\n' 'd45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea  zig-x86_64-linux-0.13.0.tar.xz' | sha256sum --check --strict
          tar -xJf zig-x86_64-linux-0.13.0.tar.xz
          echo "$TOOLS/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
          pg_config --bindir >> "$GITHUB_PATH"

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          # the shared Node job image runs as root; initdb requires an unprivileged user.
          chown postgres:postgres "$GITHUB_WORKSPACE"
          install -d -o postgres -g postgres -m 0755 /tmp/opencode
          install -d -o postgres -g postgres -m 0700 /tmp/opencode/task12-fix-2
          runuser -u postgres -- env PATH="$PATH" C_INCLUDE_PATH=/usr/include/postgresql npm test

      - name: Publish image and digest request
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          RELEASE="$(date -u +%Y%m%dT%H%M%S)-${GITHUB_SHA::8}"
          [[ "$RELEASE" =~ ^[0-9]{8}T[0-9]{6}-[0-9a-f]{8}$ ]]
          REQUEST="/publish/requests/mine-platform.digest.${RELEASE}.tmp"
          test ! -e "$REQUEST"
          test ! -L "$REQUEST"
          trap 'rm -f -- "$REQUEST"' EXIT
          IMG=10.69.0.17:5000/scclie/mine-platform:main
          docker build --pull --no-cache -t "$IMG" .
          docker push "$IMG"
          REPO_DIGESTS="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMG")"
          DIGEST=''
          while IFS= read -r candidate; do
            case "$candidate" in
              "${IMG%:main}@"*) DIGEST="${candidate#*@}" ;;
            esac
          done <<< "$REPO_DIGESTS"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          (set -o noclobber; printf '%s\n' "$DIGEST" > "$REQUEST")
          mv -Tf -- "$REQUEST" /publish/requests/mine-platform.digest
